id: software_request
title: 'Software request'
description: 'Shared request form for paid (chargeback) software. Appears on Software pages through the Request form field and replaces the Kivuto cart and checkout.'
categories: {  }
elements: |-
  software:
    '#type': webform_computed_token
    '#title': Software
    '#required_error': 'Open this form from a software page.'
    '#states':
      required:
        ':input[name="software"]':
          empty: true
    '#display_on': form
    '#mode': text
    '#template': '[webform_submission:source-entity:title:clear]'
    '#hide_empty': true
  software_missing:
    '#type': webform_message
    '#states':
      visible:
        ':input[name="software"]':
          empty: true
    '#message_type': warning
    '#message_message': '<p>Open this form from a software page. Find the software in the catalog and click its Request this software button.</p>'
  request_details:
    '#type': container
    '#states':
      visible:
        ':input[name="software"]':
          filled: true
    '#format': container
    requester_name:
      '#type': textfield
      '#title': 'Requester name'
      '#required': true
      '#default_value': '[current-user:display-name]'
    requester_email:
      '#type': email
      '#title': 'Requester email'
      '#description': 'Used to send confirmation and follow-up.'
      '#required': true
      '#default_value': '[current-user:mail]'
    request_for:
      '#type': radios
      '#title': 'Request for'
      '#description': '<p>Myself is one license for you. Someone else is one license for each person you list.</p>'
      '#options':
        myself: Myself
        someone_else: 'Someone else'
      '#required': true
      '#default_value': myself
    for_people:
      '#type': webform_custom_composite
      '#title': 'People who need this software'
      '#description': '<p>Include yourself if you also need a license for the requested software.</p>'
      '#required': true
      '#states':
        visible:
          ':input[name="request_for"]':
            value: someone_else
      '#multiple__item_label': person
      '#multiple__min_items': 1
      '#multiple__sorting': false
      '#multiple__add': false
      '#multiple__add_more_input': false
      '#multiple__add_more_button_label': 'Add another person'
      '#format_items': table
      '#element':
        name:
          '#type': textfield
          '#required': true
          '#title': Name
          '#required_error': 'Enter a name, or remove this row with the minus button.'
        email:
          '#type': email
          '#required': true
          '#title': 'Lehigh email'
          '#pattern': '[^@\s]+@[Ll][Ee][Hh][Ii][Gg][Hh]\.[Ee][Dd][Uu]'
          '#pattern_error': 'Please use a @lehigh.edu email address.'
          '#required_error': 'Enter a Lehigh email, or remove this row with the minus button.'
    price:
      '#type': value
      '#title': 'Price per license'
      '#value': '[webform_submission:source-entity:field_price:value:clear]'
      '#field_prefix': $
    licenses:
      '#type': webform_computed_twig
      '#title': Licenses
      '#display_on': view
      '#mode': text
      '#template': '{{ data.for_people ? data.for_people|length : 1 }}'
      '#whitespace': trim
      '#store': true
    total:
      '#type': webform_computed_twig
      '#title': Total
      '#display_on': view
      '#mode': text
      '#template': '${{ ((data.price ?: 0) * (data.licenses ?: 1))|number_format(2) }}'
      '#whitespace': trim
    index_number:
      '#type': textfield
      '#title': 'Index number'
      '#description': 'The Banner index number that will be charged.'
      '#required': true
      '#pattern': '[A-Za-z0-9\-]{3,20}'
      '#pattern_error': 'Index number should be 3-20 letters, numbers or dashes'
    department:
      '#type': textfield
      '#title': Department
      '#required': true
    authorized_signer:
      '#type': textfield
      '#title': 'Authorized signer'
      '#description': 'Person authorized to approve charges to this index.'
      '#required': true
    price_display:
      '#type': webform_markup
      '#states':
        visible:
          ':input[name="software"]':
            filled: true
      '#admin_title': 'Price display'
      '#markup': '<p>Price per license: $[webform_submission:source-entity:field_price:value:clear]. Your total is shown on the review page, before you submit.</p>'
    notes:
      '#type': textarea
      '#title': Notes
  workflow:
    '#type': webform_workflows_element
    '#title': 'Approval status'
    '#access_update_roles':
      - software_manager
    '#access_transition_approve_roles':
      - administrator
      - software_manager
    '#access_transition_deny_roles':
      - administrator
      - software_manager
    '#access_update_at_state_approved_override': true
    '#access_update_at_state_approved_workflow_enabled': false
    '#access_update_at_state_denied_override': true
    '#access_update_at_state_denied_workflow_enabled': false
    '#workflow': software_request_approval
    '#show_workflow_form_on_view': false
    '#hide_if_no_transitions': true
    '#log_public_setting': Optional
    '#log_admin_setting': Optional
    '#transition_element_type': radios
    '#state_pending_color': Orange
    '#state_approved_color': Green
    '#state_denied_color': Red
  for_emails:
    '#type': webform_computed_twig
    '#title': 'Proxy emails'
    '#display_on': none
    '#mode': text
    '#template': "{% for person in data.for_people %}{{ person.email }}{{ loop.last ? '' : ', ' }}{% endfor %}"
    '#whitespace': trim
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#states':
      visible:
        ':input[name="software"]':
          filled: true
    '#submit__label': 'Submit request'
    '#preview_prev__label': 'Edit request'
    '#preview_next__label': 'Review request'
